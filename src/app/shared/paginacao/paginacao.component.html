<nav aria-label="Navegação de página exemplo" style="padding: 30px 0px;">
    <ul class="pagination justify-content-end">
      <li class="page-item">
        <a class="page-link" aria-label="Anterior">
          <span aria-hidden="true">&laquo;</span>
          <button (click)="setPage(currentPage - 1)"> Anterior</button>
        </a>
      </li>
      <li class="page-item">
        <a class="page-link" aria-label="Próximo">
          <span aria-hidden="true">&raquo;</span>
          <button (click)="setPage(currentPage + 1)"> Próximo</button>
        </a>
      </li>
    </ul>
</nav>
